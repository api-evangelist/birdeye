consequence: >-
  With no SDK and no CLI, every Birdeye integration is hand-rolled HTTP. That raises the
  cost of the API's own inconsistencies — three pagination conventions, five date
  formats, and business errors returned inside HTTP 200 bodies — because no first-party
  library absorbs them for the caller.
