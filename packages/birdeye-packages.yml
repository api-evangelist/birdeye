finding: >-
  Birdeye publishes no first-party client library in any package registry. The developer
  documentation at docs.birdeye.com carries no SDK section, no install instructions and
  no code-generation offer — integration is raw HTTP with an x-api-key header, or the
  hosted MCP server for agents.
