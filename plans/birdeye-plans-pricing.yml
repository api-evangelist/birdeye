notes:
- Birdeye does not publish flat-rate tiers publicly; all pricing is quote-driven based on number of locations
  and features selected.
- The pricing configurator requires contact information submission.
- API access is only available on the Premium/Enterprise tier.
- An additional daily API call limit of approximately 10,000 requests applies per API key on standard
  accounts; higher limits are negotiated on enterprise plans.
