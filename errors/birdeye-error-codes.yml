- code: 4011
  family: authentication-authorization
  message: User is not authorized to perform this action.
  source: live probe of https://api.birdeye.com/ (HTTP 401), 2026-08-13
remediation:
  rate-limit: HTTP 429 or code 89 / 1541. Back off exponentially. The per-key limit is not published;
    Birdeye tells callers to ask support for their current limit.
  authentication-authorization: Codes 1161 (invalid API key), 1167 (API key missing), 1380 (api key or
    session token missing), 4011 (not authorized). Send a valid x-api-key header from a backend service,
    never from a browser.
  integration-downstream: 20xxx/21xxx codes are failures at a connected third party (Google, Facebook,
    Care Dash, Rent). Retry later or reconnect the integration; they are not caller input errors.
  validation-generic: Code 400 is reused for many distinct input problems; read the message.
