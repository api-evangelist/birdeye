  /v1/listing/{businessNumber}/get:
    get:
      summary: Get Listing
      operationId: get-listing
      tags:
      - Listing
      parameters:
      - name: businessNumber
        in: path
        required: true
        description: Business Number.
        schema:
          type: number
        example: '169744180007807'
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 89
                  message: Rate limit exceeded
  /v1/listing/{businessNumber}/more-hours-type:
    get:
      summary: Get More Hours Type
      operationId: get-more-hours-type
      tags:
      - Listing
      parameters:
      - name: businessNumber
        in: path
        required: true
        description: Business Number.
        schema:
          type: number
        example: '169744180007807'
      - name: channel
        in: query
        required: true
        description: Source name for which more hours type needs to be fetched. Possible values are gmb, apple. Default value will be gmb if not passed
        schema:
          type: string
        example: gmb
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 400
                  message: Invalid Source Name
  /v1/listing/{businessNumber}/gmb/keywords:
    post:
      summary: Get Google Keywords Count
      operationId: get-google-keywords-count
      tags:
      - Listing
      parameters:
      - name: businessNumber
        in: path
        required: true
        description: Account Business Number.
        schema:
          type: string
        example: '169744180007807'
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 2458
                  message: Invalid order value. Allowed values are 'asc' or 'desc'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: http://json-schema.org/draft-07/schema#
              type: object
              properties:
                selectedMonth:
                  type: array
                selectedkeywords:
                  type: array
                keywordsSearch:
                  type: string
                limit:
                  type: number
                startIndex:
                  type: number
                sortby:
                  type: string
                order:
                  type: string
                businessNumbers:
                  type: array
              required:
              - selectedMonth
  /v1/listing/{businessNumber}/deactivate:
    post:
      summary: Deactivate Listing
      operationId: deactivate-listing
      tags:
      - Listing
      parameters:
      - name: businessNumber
        in: path
        required: true
        description: Business Number.
        schema:
          type: number
        example: '169744180007807'
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 89
                  message: Rate limit exceeded
  /v1/listing/menu-details:
    post:
      summary: Retrieve Menu Details
      operationId: retrieve-menu-details
      tags:
      - Listing
      parameters: []
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 2458
                  message: Invalid order value. Allowed values are 'asc' or 'desc'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: http://json-schema.org/draft-07/schema#
              type: object
              properties:
                businessNumbers:
                  type: array
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Partner specific API key provided by Birdeye for data exchange.
