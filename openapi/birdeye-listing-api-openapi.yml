openapi: 3.2.0
info:
  title: Birdeye Listing API
  version: '1.0'
  description: 'Operations tagged Listing across 2 of this provider''s published API definitions: birdeye-birdeye-api-openapi.yml, birdeye-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.birdeye.com
  description: Production
- url: https://api.birdeye.com/resources
tags:
- name: Listing
  description: Keep your business information accurate and consistent across 50+ websites.
paths:
  /v1/listing/fix:
    post:
      summary: Fix Listing
      operationId: fix-listing
      tags:
      - Listing
      parameters:
      - name: b_id
        in: query
        required: true
        description: Id of the business.
        schema:
          type: number
        example: '12345678'
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 1175
                  message: No business found with the given id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example: {}
      security:
      - apiKey: []
    servers:
    - url: https://api.birdeye.com
      description: Production
  /v1/listing/status/location:
    get:
      summary: Get Location Status Report
      operationId: get-location-status-report
      tags:
      - Listing
      parameters:
      - name: businessNumber
        in: query
        required: true
        description: Id of the business.
        schema:
          type: number
        example: '169744180007807'
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 1043
                  message: Business should be either SMB or Enterprise sub account
      security:
      - apiKey: []
    servers:
    - url: https://api.birdeye.com
      description: Production
  /v1/listing/insights:
    post:
      summary: Listings Insights
      operationId: listings-insights
      tags:
      - Listing
      parameters:
      - name: businessId
        in: query
        required: true
        description: Id of the account.
        schema:
          type: number
        example: '12345678'
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 1175
                  message: No business found with the given id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: http://json-schema.org/draft-07/schema#
              type: object
              properties:
                businessNumbers:
                  type: array
                startDate:
                  type: string
                endDate:
                  type: string
                viewMode:
                  type: array
              required:
              - viewMode
      security:
      - apiKey: []
    servers:
    - url: https://api.birdeye.com
      description: Production
  /v1/listing/report/{reportType}/datapoints:
    post:
      summary: Listings Insights Datapoints
      operationId: listings-insights-datapoints
      tags:
      - Listing
      parameters:
      - name: reportType
        in: path
        required: true
        description: Report type, Possible values [google_view_search_map, gmb_customer_actions_map, fb_users_reached,fb_users_engaged, bing_impression_count,bing_customer_actions]
        schema:
          type: string
        example: google_view_search_map
      - name: businessId
        in: query
        required: true
        description: Id of the account.
        schema:
          type: number
        example: '12345678'
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 1175
                  message: No business found with the given id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: http://json-schema.org/draft-07/schema#
              type: object
              properties:
                businessNumbers:
                  type: array
                startDate:
                  type: string
                endDate:
                  type: string
                viewMode:
                  type: array
                groupByType:
                  type: string
      security:
      - apiKey: []
    servers:
    - url: https://api.birdeye.com
      description: Production
  /v1/listing/{businessNumber}/gmb-attributes-list:
    get:
      summary: Get GMB Attributes
      operationId: get-gmb-attributes
      tags:
      - Listing
      parameters:
      - name: businessNumber
        in: path
        required: true
        description: Business Number.
        schema:
          type: number
        example: '169744180007807'
      - name: categoryId
        in: query
        required: true
        description: Category id.
        schema:
          type: string
        example: gcid:electrical_installation_service
      - name: countryCode
        in: query
        required: true
        description: Code of the country, Possible values are US,CA,AU,PR,NZ,MX,IN,UK,FR,IT.
        schema:
          type: string
        example: US
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 2286
                  message: Invalid whatsapp business link
      security:
      - apiKey: []
    servers:
    - url: https://api.birdeye.com
      description: Production
