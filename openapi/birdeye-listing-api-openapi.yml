    servers:
    - url: https://api.birdeye.com
      description: Production
  /v1/listing/get/hotel-attributes:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apiary_getHotelAttributes_Response200'
              example:
                hotelAttributes:
                  services:
                    services:
                      frontDesk:
                        attributeId: frontDesk
                        attributeName: Front desk
                        possibleValues:
                        - value: true
                          name: Available
                        - value: false
                          name: Not Available
                        columnId: 20001
                        attributeValueType: BOOLEAN
                      twentyFourHourFrontDesk:
                        attributeId: twentyFourHourFrontDesk
                        attributeName: Twenty four hour front desk
                        possibleValues:
                        - value: true
                          name: Available
                        - value: false
                          name: Not Available
                        columnId: 20002
                        attributeValueType: BOOLEAN
                      giftShop:
                        attributeId: giftShop
                        attributeName: Gift shop
                        possibleValues:
                        - value: true
                          name: Available
                        - value: false
                          name: Not Available
                        columnId: 20011
                        attributeValueType: BOOLEAN
                      languagesSpoken:
                        attributeId: languagesSpoken
                        attributeName: Languages Spoken
                        possibleValues:
                        - value: Arabic
                          name: Arabic
                        - value: English
                          name: English
                        - value: French
                          name: French
                        - value: Spanish
                          name: Spanish
