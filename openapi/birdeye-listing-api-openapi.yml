              properties:
                businessInfo:
                  type: object
                  properties:
                    name:
                      type: string
                    phone:
                      type: string
                    websiteUrl:
                      type: string
                    emailId:
                      type: string
                    isAddressHidden:
                      type: string
                    isServiceAreaProvider:
                      type: string
                    mainBusinessDescription:
                      type: string
                    serviceAreas:
                      type: array
                    location:
                      type: object
                      properties:
                        address1:
                          type: string
                        address2:
                          type: string
                        city:
                          type: string
                        state:
                          type: string
                        countryCode:
                          type: string
                        zip:
                          type: string
                        subLocality:
                          type: string
                      required:
                      - zip
                  required:
                  - name
                  - phone
                additionalInfo:
                  type: object
                  properties:
                    establishedYear:
                      type: number
                    timezone:
                      type: string
                    languages:
                      type: array
                    moreHours:
                      type: array
                    appleMoreHours:
                      type: array
                    wholeWeekOperating:
                      type: number
                    hoursOfOperations:
                      type: array
                    specialHours:
                      type: array
                    businessStatus:
                      type: string
                    reopenDate:
                      type: string
                    services:
                      type: string
                    keywords:
                      type: string
                    products:
                      type: string
                    appointmentLink:
                      type: string
                    reservationLink:
                      type: string
                    menuLink:
                      type: string
                    orderAheadLink:
                      type: string
                    impressum:
                      type: string
                    paymentTypes:
                      type: array
                    additionalPaymentTypes:
                      type: string
                    localPhoneNumber:
                      type: string
                    tollFreePhoneNumber:
                      type: string
                    androidAppURL:
                      type: string
                    iosAppURL:
                      type: string
                  required:
                  - hoursOfOperations
                  - services
                media:
                  type: object
                  properties:
                    logoUrl:
                      type: string
                    coverImageUrl:
                      type: string
                    gmbCover:
                      type: string
                    facebookCover:
                      type: string
                optOut:
                  type: object
                  properties:
                    gmbLogoOptOut:
                      type: boolean
                    fbLogoOptOut:
                      type: boolean
                    gmbCoverOptOut:
                      type: boolean
                    fbCoverOptOut:
                      type: boolean
                    gmbProfileOptOut:
                      type: boolean
                    businessProfileOptOut:
                      type: boolean
                covidInfo:
                  type: object
                  properties:
                    postDescription:
                      type: string
                    covid19SupportLink:
                      type: string
                    virtualCareLink:
                      type: string
                bingListing:
                  type: object
                  properties:
                    primaryCategoryBing:
                      type: string
                    bingCategories:
                      type: array
                    bingPhoneNumber:
                      type: string
                    bingDescription:
                      type: string
                internalListing:
                  type: object
                  properties:
                    description:
                      type: string
                    category:
                      type: string
                    subCategories:
                      type: array
                    displayCategory:
                      type: string
                  required:
                  - description
                  - category
                  - subCategories
                facebookListing:
                  type: object
                  properties:
                    facebookPhoneNumber:
                      type: string
                    categories:
                      type: array
                    facebookDescription:
                      type: string
                gmbListing:
                  type: object
                  properties:
                    googleWebsiteUrl:
                      type: string
                    googlePhoneNumber:
                      type: string
                    googleStoreId:
                      type: string
                    primaryCategoryGmb:
                      type: string
                    additionalCategories:
                      type: array
                    googleDescription:
                      type: string
                    attributes:
                      type: object
                    foodDelivery:
                      type: string
                    foodTakeout:
                      type: string
                    whatsappBusinessLink:
                      type: string
                    textMessageNumber:
                      type: string
                appleListing:
                  type: object
                  properties:
                    phoneNumber:
                      type: string
                    appleWebsiteUrl:
                      type: string
                    primaryCategory:
                      type: string
                    additionalCategories:
                      type: array
                    appleLocationAttributes:
                      type: object
                    appleActionLinks:
                      type: object
                    appleBusinessName:
                      type: string
                    appleBusinessDescription:
                      type: string
                thirdPartyListing:
                  type: object
                  properties:
                    thirdPartyCategory:
                      type: string
                    thirdPartySubCategories:
                      type: string
                socialProfileURLs:
                  type: object
                  properties:
                    facebookUrl:
                      type: string
                    twitterUrl:
                      type: string
                    linkedInUrl:
                      type: string
                    googleUrl:
                      type: string
                    youTubeUrl:
                      type: string
                    instagramUrl:
                      type: string
                    pintrestUrl:
                      type: string
                    bbbUrl:
                      type: string
                    lendingtreeUrl:
                      type: string
                healthcare:
                  type: object
                  properties:
                    doctorCategories:
                      type: string
                    isProvider:
                      type: boolean
                    practiceName:
                      type: string
                    firstName:
                      type: string
                    middleName:
                      type: string
                    surName:
                      type: string
                    npi:
                      type: number
                    credentials:
                      type: string
                    university:
                      type: string
                    hospitalAffiliations:
                      type: string
                    insurancesAccepted:
                      type: string
      security:
      - apiKey: []
    servers:
    - url: https://api.birdeye.com
      description: Production
