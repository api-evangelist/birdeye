    includes the customer''s experience score and source.



    05/25/2026 - Added Update Custom card (PUT) and Delete Custom card (DELETE) API
    documentation under the Business profile custom card section.



    05/11/2026 - Added support for backdated survey responses in the POST Survey Response
    API. The created field (UTC Epoch milliseconds) is optional; if omitted, the server
    defaults to the current UTC timestamp.



