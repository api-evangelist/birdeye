    08/21/2025 - Added Single main business description Support.



    08/19/2025 - Added competitor /raptor public APIs for reviews aggregates.



    06/26/2025 - Added Contact V2 APIs with communication preference flag support.



    12/13/2024 - Added inline reply support for GetReviews APIs.



    09/27/2024 - Added update for Google Opening Soon (BIRD-56987)



