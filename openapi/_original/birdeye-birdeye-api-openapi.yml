              - active
tags:
- name: Business
  description: Create and maintain your business on Birdeye.
- name: Custom Fields
  description: Create, delete , update , associate and get custom fields easily.
- name: User
  description: Delete and manage user profiles and permissions easily.
- name: Reviews
  description: Consistently generate more reviews and higher ratings.
- name: Contact
  description: Manage contacts across locations effortlessly with a robust Contact
    Management System.
- name: Contact V2
  description: Easily manage contacts across multiple locations using enhanced Contact
    APIs, featuring built-in support for communication preference flags.
- name: Campaign
  description: Create a short link for review requests and set review sources in the
    template.
- name: Aggregation
  description: Access your public data from 150+ review sites.
- name: Report
  description: Various reporting data points across Birdeye modules like reviews,
    insights and competitors etc for all your data visualisation
- name: Survey
  description: Engage each customer at the right time with NPS or CSAT surveys to
    improve your service.
- name: Business Media
  description: 'Add, delete and manage business media.


    Supported Media Size


    Photo: JPG or PNG. 720 x 720px. 10KB min.

    Video: 30 sec long. 720p or more upto 75MB.




    Note


    Uploaded media will be pushed to your google business profile (if connected) and
    other long tail directories only.'
- name: Social
  description: Create and track Social posting for all channels.
- name: Employee
  description: ''
- name: Conversation
  description: Connect with customers across a range of digital channels from one
    unified inbox.
- name: Subscription
  description: Subscribe or Unsubscribe multiple webhooks with different URLs or Events
    for a subscription and deliver real-time notifications.
- name: Webhook
  description: Configure multiple webhooks with different URLs for a subscription
    and deliver real-time notifications.
- name: Competitor
  description: Make competitive insights your unfair advantage.
- name: Competitor AI
  description: Competitive intelligence, simplified by AI.
- name: Insight AI
  description: Insight intelligence, simplified by AI.
- name: Google Q&A
  description: 'Note


    Applicable to be used only by paid listings clients, for their active locations,
    for the Google Q&amp;A section, in the Google listing'
- name: Google Services
  description: 'Note


    Applicable to be used only by paid listings clients, for their active locations,
    for the Google Services section, in the Google listing.

    No two services should have the same service name. It is recommended that all
    services created should  HAVE UNIQUE service names.

    You CAN have the same service across two diff categories e.g.: Emergency counselling
    as a $100 paid service can be a service created &amp; mapped to category A - Mental
    health and category B - Psychotherapy - both categories being present for the
    same location.'
- name: FAQ
  description: To retrieve all Question and Answer (QnA) entries across locations
    using FAQ APIs, enabling smart support and knowledge features for businesses.
- name: Listing
  description: Keep your business information accurate and consistent across 50+ websites.
- name: GMB Products
  description: To manage products, locations, and business details through Listing
    GMB platform
- name: Search AI
  description: Search AI provides a comprehensive view of your business performance
    across AI-powered search platforms, including data accuracy, sentiment analysis,
    citations, brand ranking, and overall visibility.
- name: Ticketing
  description: Create standout customer support with ticketing across reviews, untagged,
    and survey responses.
- name: Integration
  description: Birdeye integrates with various software or tools you use.
- name: Change Logs
  description: '06/10/2026 - Updated Get Contact API to support an optional experienceScore
