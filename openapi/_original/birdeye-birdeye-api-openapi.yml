    02/03/2026 - Added the &quot;Get All QnA&quot; API under FAQ group to enable retrieval
    of QnA entries across business locations, with full request and response documentation



    01/19/2026 - Added a note under the Authentication and Rate limiting section specifying
    that the x-api-key header is mandatory for all API requests targeting EU region
    business accounts.



    01/13/2026 - Added Create User (Signup) API under User module to create and invite
    users for a business.



    09/22/2025 - Added GMB Products APIs to onboard/connect Google Merchant accounts
