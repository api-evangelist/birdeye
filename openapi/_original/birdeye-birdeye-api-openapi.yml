    to retrieve location-wise metrics and benchmark score.



    03/18/2026 - Added Create Custom Card Time API under custom fields section.



    03/03/2026 - Added Response Time (overtime &amp; by-location) and Response Rate(overtime
    &amp; by-location) APIs under reports section and created group for Competitor
    AI.



    03/02/2026 - Added sendInvite (boolean, default - true) field in Create User Signup
    v2 API request body and attributes.



    02/11/2026 - Updated the API key identifier for applicable APIs by moving it from
