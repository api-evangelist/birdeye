openapi: 3.2.0
info:
  title: Birdeye Google Q&A API
  version: '1.0'
  description: 'Operations tagged Google Q&A across 2 of this provider''s published API definitions: birdeye-birdeye-api-openapi.yml, birdeye-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.birdeye.com
  description: Production
- url: https://api.birdeye.com/resources
tags:
- name: Google Q&A
  description: 'Note


    Applicable to be used only by paid listings clients, for their active locations, for the Google Q&amp;A section, in the Google listing'
paths:
  /v1/qna/question/create:
    post:
      summary: Create Question
      operationId: create-question
      tags:
      - Google Q&A
      parameters:
      - name: businessId
        in: query
        required: true
        description: Id of the business.
        schema:
          type: string
        example: '12345678'
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 2483
                  message: Question should have minimum 3 words
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: http://json-schema.org/draft-07/schema#
              type: object
              properties:
                question:
                  type: string
                answer:
                  type: string
              required:
              - question
              - answer
      security:
      - apiKey: []
    servers:
    - url: https://api.birdeye.com
      description: Production
