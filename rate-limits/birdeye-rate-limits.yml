method_note: Birdeye publishes NO numeric rate limit. Its own authentication page says "There is a limit to calling
  APIs with each API key [connect with the support team to get the current limit]." HTTP 429 and business code 89
  "Rate limit exceeded" (also 1541 "Rate Limit of API has been exceeded") are documented as the exhaustion signals.
  The entries below are account-level reference thresholds, not provider-published numbers.
response_headers:
  published: false
  note: "No RateLimit-* or X-RateLimit-* header contract is documented anywhere in the Birdeye developer docs or\
    \ the published OpenAPI. The X-RateLimit-* entries previously recorded here are conditional (\"if returned\"\
    ) and unconfirmed \u2014 an agent cannot rely on a runtime remaining-quota signal from this API."
exhaustion:
  http_status: 429
  body_codes:
  - 89
  - 1541
  retry_after_header: false
  guidance: Exponential backoff; the docs give no Retry-After.
