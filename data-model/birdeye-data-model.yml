method: derived
source: openapi/_original/birdeye-openapi-original.yml (https://docs.birdeye.com/api/openapi.yaml)
derivation: >-
  Entities and relationships were derived from the 790 component schemas and the
  id-reference fields carried across request/response bodies in the published OpenAPI.
  The spec uses inline schemas rather than a $ref graph between entities, so
  relationships were read from id-field naming (businessNumber, businessId, customerId,
  reviewId, surveyId, ticketId, competitorId, productId, subscriptionId, trackingId) and
  from the path hierarchy. Cardinalities the docs do not state are marked assumed.
identity_model:
  root: Business
  finding: >-
    Almost everything in Birdeye hangs off a business identifier, and the API uses at
    least three names for it — `businessId`, `businessNumber` and `accountNumber` —
    sometimes for the same value and sometimes for different levels of the hierarchy.
    This is the single biggest modelling hazard for an integrator.
  identifier_variants:
  - field: businessNumber
    usage: >-
      Long numeric account/location identifier (example 169744180007807). Several
      operations require the ACCOUNT business number specifically, not a location's —
      create-webhook-subscription says so explicitly.
    occurrences: 22
  - field: businessId
    usage: Short numeric business identifier (example 12345678); also appears as business_id and business_Id.
    occurrences: 15
  - field: accountNumber
    usage: Used by the Social module for the same account-level concept.
    occurrences: 4
  - field: subBusinessNumbers / subBusinessIds
    usage: Child location identifiers for fan-out operations (social posting, review filters).
  - field: externalId / externalReferenceId
    usage: Caller-owned correlation key on contacts, tickets and businesses.
  path_case_inconsistency: >-
    The same concept appears as {businessId}, {business_id}, {business_Id} and
    {businessNumber} across different paths in the same specification.
entities:
- name: Business
  description: An account, reseller, enterprise, or individual location. The root of the graph.
  ids: [businessId, businessNumber, business_id]
  operations: [create-a-business, get-business, update-business, delete-business,
    search-business, update-the-status, get-child-businesses, get-hierarchy-for-an-enterprise,
    update-hierarchy, get-timezone-list, get-birdeye-impressions]
  spec: openapi/birdeye-business-api-openapi.yml
- name: Location
