gaps:
- No $ref graph between entities — 790 schemas are largely inline and per-operation.
- No canonical object reference page; entity shapes must be read per operation.
- No id-prefix scheme (unlike Stripe's cus_/inv_); all identifiers are bare numerics.
- Three names for the business identifier, four path-parameter spellings.
