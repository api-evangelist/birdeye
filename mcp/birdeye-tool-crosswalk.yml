rest_only:
- capability: Write operations across every module
  reason: >-
    The Birdeye MCP server is documented as read-only — "No write access to your Birdeye
    account is requested or granted." Every REST create/update/delete operation is
    therefore REST-only by design, not by omission.
  examples: [create-a-business, update-business, delete-business, post-review-reply,
    create-tags, delete-a-tag, create-or-update-contact, delete-contact, create-listing,
    update-listing, deactivate-listing, create-survey, update-survey-settings,
    schedule-social-post, edit-scheduled-social-post, delete-public-social-post,
    create-ticket, update-ticket, add-ticket-comments, create-webhook-subscription,
    create-subscription, unsubscribe-subscription, create-question, create-answer,
    create-service, create-product-listing, add-media, delete-media, create-user,
    delete-a-user, add-aggregation-url, delete-aggregation-url]
- capability: Reporting beyond the review/rating overview
  reason: No MCP tool is documented for the wider Report module.
  examples: [get-dashboard-data, get-review-conversion-report, reviews-rating-by-location-report,
    review-count-rating, review-count-rating-by-employee, nps-over-time-report,
    nps-by-location-report, review-by-source-report, visitor-report, usage-report,
    review-response-rate-over-time, average-response-time-by-location]
- capability: Competitor (non-AI) module
  reason: Only the Competitor AI tools are exposed; the classic Competitor module is REST-only.
  examples: [get-competitor-business, get-business-competitors, get-competitor-reviews,
    get-score, get-theme-statistics, get-keyword-statistics]
- capability: Contact / Contact V2, Conversation, Custom Fields, Employee, FAQ,
    Google Q&A, Google Services, Campaign, Business Media, Integration, Webhook
  reason: No MCP tools documented for these modules.
